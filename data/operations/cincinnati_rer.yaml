# Cincinnati RER (TRI) operating eras. Paris-RER-style through-running: branches on
# each side connect through a central trunk (KMZ segments named "...Trunk..."), so
# services are branch-to-branch pairs. Signalling differs between trunk and branches
# (cf. Paris RER A: SACEM on the core; RER B/D/E and Elizabeth line: CBTC/ATO core,
# conventional signalling on the branches).
# Canon fleet: Brightliner 1934-51, Silverliner 1951-69, Swiftliner 1969-80s, A 1979-96,
# B 1985-2006 (SACEM, 90 s headways), C 1996-2018, D 2006-25 (CBTC), E 2018-, F 2025-.
# Single-deck trunk stream B > D > F is the default; pass --train for the bilevel stream.
# No conductors in any era: driver-only operation with passenger push-button doors, as on
# the Paris RER (driver releases, passengers open, driver closes and departs).

system: Cincinnati RER
default_year: 2026

fleet:
  - {from: 1934, train: RER_BRIGHTLINER}
  - {from: 1951, train: RER_SILVERLINER}
  - {from: 1969, train: RER_SWIFTLINER}
  - {from: 1985, train: RER_B_SET}
  - {from: 2006, train: RER_D_SET}
  - {from: 2025, train: RER_F_SET}

eras:
  - name: "Interurban era: automatic block signals, driver-only, low platforms"
    years: [1934, 1950]
    overlay:
      signalling: {system: lineside}
      stations: {defaults: {platform: low}}   # steps at every door (Brightliner)
      dwell: {door_control: button, dispatch: 5.0, brake_release: 3.0}   # mirrors only

  - name: "Cab signals (pulse-code), driver-only, low platforms"
    years: [1951, 1968]
    overlay:
      signalling: {system: cab}
      stations: {defaults: {platform: low}}   # heated steps at every door (Silverliner)
      dwell: {door_control: button, dispatch: 4.5, brake_release: 2.5}

  - name: "S-Bahn era: cab signals, high-level platforms, driver-only"
    years: [1969, 1984]
    overlay:
      signalling: {system: cab}
      dwell: {door_control: button, dispatch: 4.0, brake_release: 2.0}

  - name: "Basin trunk opens: SACEM-type supervision on the trunk, cab signals on branches"
    years: [1985, 2005]
    overlay:
      signalling: {system: cab}
      operating_zones:
        - {name: trunk, match: "Trunk", signalling: {system: sacem}, driver: {mode: manual}}
      dwell: {door_control: button, dispatch: 3.5, brake_release: 1.5}

  - name: "CBTC with ATO on the trunk (GoA2), cab signals / PTC on branches"
    years: [2006, 2100]
    overlay:
      signalling: {system: cab}
      operating_zones:
        - {name: trunk, match: "Trunk", signalling: {system: cbtc}, driver: {mode: ato}}
      dwell: {door_control: button, dispatch: 3.0, brake_release: 1.5}   # CCTV door check

# ---------------------------------------------------------------------------------------
# Service history (read by tools/make_cincinnati_configs.py). Before through-running, every
# line ran into Union Terminal (CUT) on the original railroad rights of way and terminated
# there (e.g. Covington Union -> C&O bridge -> C&O viaduct -> CUT); a Dayton-CUT train might
# go on as a CUT-Verona train after its stop, but there was no Dayton-Verona line. RER-1's
# eastern branches ended at Times, a stub terminal like Boston North Station.
# Through-running starts line by line: the crosstown tunnel opens for RER A (RER-1) in 1985,
# RER B and RER C (moderate upgrades for SACEM) in 1988, the RER D connection in 1990 and
# RER E in 1996 through a new deep-bore tunnel.
through_from:
  RER-1: 1985
  RER-2: 1988
  RER-3: 1988
  RER-4: 1990
  RER-5: 1996

# RER-3 (C) runs underground in an embanked covered way along the Ohio from Sedamsville to
# Riverbend/Belterra (like RATP RER C along the Seine): on the map it looks like it is in
# the river; the portals are where the embankment ends. Each entry becomes a
# `profile.structures` tunnel in the generated configs (tunnel drag, profile free of the
# river surface).
covered_ways:
  RER-3: [{from_station: Sedamsville, to_station: Riverbend/Belterra}]
  # RER-5's 1996 deep bore (portals west of Norwood Central and north of Ludlow) and every
  # other trunk structure come from the designed cores (data/profile/rer/canon.json)
  RER-5: []

history:
  rer_era_only:     # terminals that open with the line's through-running
    RER-1: [Northgate]
    RER-2: [CVG Terminal 1]
    RER-3: [CVG Terminal 1]
  services:         # pre-through services; `via` names a line in data/kmz/cincinnati_historic.kml
    - {line: RER-1, from: Miami University / OXFORD, to: Union Terminal, via: Historic Oxford approach}
    - {line: RER-1, from: Miamitown, to: Union Terminal, via: Historic Miamitown approach}
    # before 1985 the eastern trains ran the old Cincinnati, Lebanon & Northern into Times:
    # open up the Deer Creek valley at about 3.5 %, two short cut-and-cover tunnels under
    # Walnut Hills, open to Dana Ave by Xavier (the 1985 tunnel replaced it from UT to Xavier)
    - {line: RER-1, from: Lebanon Station, to: Times, profile: {max_grade: 0.035, allow_tunnels: true},
       note: "CL&N into Times on today's drawn alignment, surface at up to 3.5 %"}
    - {line: RER-1, from: Fayetteville, to: Times, profile: {max_grade: 0.035, allow_tunnels: true},
       note: "CL&N into Times on today's drawn alignment, surface at up to 3.5 %"}
    - {line: RER-2, from: Camden, to: Union Terminal}
    - {line: RER-2, from: Dayton Airport, to: Union Terminal}
    - {line: RER-2, from: Kettering, to: Union Terminal}
    - {line: RER-2, from: Falmouth, to: Union Terminal, via: "Historic C&O Covington - Union Terminal", to_point: [39.1097, -84.5415]}
    - {line: RER-2, from: Verona, to: Union Terminal, via: "Historic C&O Covington - Union Terminal", to_point: [39.1097, -84.5415]}
    # before 1990: Newport west on the C&O through Covington, over the C&O bridge and the C&O
    # viaduct into UT's top platforms. The Dover line runs onto the C&O at Newport; the
    # Claryville line (Carthage, Grants Lick) meets it facing the wrong way, so those two keep
    # today's trunk until their connection is ruled
    - {line: RER-4, from: Carthage, to: Union Terminal, approx: "Claryville line has no drawn connection to the C&O; today's trunk used"}
    - {line: RER-4, from: Dover, near: [38.759297, -83.884417], to: Union Terminal, via: "Historic C&O Newport - Union Terminal",
       to_point: [39.1097, -84.5415]}
    - {line: RER-4, from: Grants Lick, to: Union Terminal, approx: "Claryville line has no drawn connection to the C&O; today's trunk used"}
    - {line: RER-4, from: Brookville, to: Union Terminal}
    - {line: RER-4, from: Greensburg, to: Union Terminal}
    # before 1996: from Norwood Central on the existing Norwood-CUT ROW west to Ivorydale,
    # then down the Mill Creek valley into UT
    - {line: RER-5, from: Waynesville, to: Union Terminal, via: "Historic Norwood - Ivorydale", to_point: [39.109739, -84.534707],
       extra: {folder: "Cincinnati RER/RER-2", name_regex: "^(RER Mill Creek Trunk|RER-2 Trunk)$"}}
    - {line: RER-5, from: Wilmington, to: Union Terminal, via: "Historic Norwood - Ivorydale", to_point: [39.109739, -84.534707],
       extra: {folder: "Cincinnati RER/RER-2", name_regex: "^(RER Mill Creek Trunk|RER-2 Trunk)$"}}
    - {line: RER-5, from: Beaverlick, to: Union Terminal, approx: "Kentucky side: original ROW into Union Terminal not ruled; today's trunk (1996 bore) used"}
    - {line: RER-5, from: Napoleon, to: Union Terminal, approx: "Kentucky side: original ROW into Union Terminal not ruled; today's trunk (1996 bore) used"}
    - {line: RER-5, from: Williamstown, to: Union Terminal, approx: "Kentucky side: original ROW into Union Terminal not ruled; today's trunk (1996 bore) used"}
    # the original CVG line (Crescent Springs - CVG, drawn in the RER-2 folder); the
    # airport opened in 1947
    - {line: RER-5, from: CVG Terminal 1, to: Union Terminal, years: [1947, null],
       extra: {folder: "Cincinnati RER/RER-2", name_regex: "^Erlanger-Beaverlick$"}}
    # before 1988: a short link along the embankment from the Mill Creek mouth into UT's top
    # (track-level) platforms, not level -2 (tools/make_historic_links.py, approximate).
    # Open along the embankment: whether the covered way predates 1988 is not ruled yet

    - {line: RER-3, from: Osgood, to: Union Terminal, via: "Historic Mill Creek link", to_point: [39.1097, -84.5415], covered: false}
    - {line: RER-3, from: Versailles, to: Union Terminal, via: "Historic Mill Creek link", to_point: [39.1097, -84.5415], covered: false}
    - {line: RER-3, from: Georgetown, to: Union Terminal, via: "Historic Mill Creek link", to_point: [39.1097, -84.5415], covered: false}
    - {line: RER-3, from: Mt Orab, to: Union Terminal, via: "Historic Mill Creek link", to_point: [39.1097, -84.5415], covered: false}
