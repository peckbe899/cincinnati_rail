# APEx alignment status. Drawn segments listed under `finished` are final alignments and
# are fitted to the drawing (20 m); every other segment is a sketch that a Hartwell-era
# engineer would still smooth, so its curves get the largest radius within
# `sketch_tolerance_m` of the drawing. Entries are segment-name regexes, or
# {match, bbox: [lat_min, lon_min, lat_max, lon_max]} for the finished part of a segment.
# Read by tools/make_apex_configs.py.
sketch_tolerance_m: 250

# Station classes: Limited = every train stops; Express = some trains stop; Local = only the
# all-stops trains stop. Every APEx station has platform screen doors (no platform-edge
# limit for passing trains, no slipstream / track-intrusion concern).
#
# APEx runs on its own right of way (no mixed traffic, so cant and deficiency are set for
# HSR alone). Cincinnati Union Terminal is split by level: HSR on the main level,
# intercity/regional trains in an underground platform box, so there is very little
# crossover there. Any truly shared approach (switches, other trains) can be listed as
# {station, speed_mph, distance_m}; none are known.
shared_approaches: []

# Station throats for stopping trains. Non-stopping trains keep line speed on dedicated
# through tracks that do not pass platforms, e.g. Forest Hills looking north
# [platform][local][passing][passing][local][platform] and Norwood looking east
# [passing][passing][gap][local][platform][local][station]. Every APEx station has platform
# screen doors, so unlike legacy hubs (Paris-Nord, Frankfurt Hbf: 60 km/h; no PSDs, open
# platform edges) platform entry is limited only by the turnouts
# (docs/research/hsr_throats.md; Amtrak #32.75 = 80 mph [P], DB 1:42 = 200 km/h):
#  * Limited hubs (and route terminals): lines converge over 160 km/h junction turnouts
#    (1:42 class) from 4 km, then 100 km/h (#26.5 / 1:18.5) through the throat from 1 km.
#  * Express and Local stations: stopping trains leave the through tracks onto the local
#    (platform) track over #32.75 turnouts at 130 km/h (80 mph), ~500 m before the platform,
#    held until the tail clears on departure.
# Non-stopping trains run the through (passing) tracks, one full track away from the
# platform doors: 125 mph past the platform (the train is held until its tail clears).
through_track_speed_mph: 125

station_throats:
  by_class:
    limited: [{speed_kmh: 160, distance_m: 4000}, {speed_kmh: 100, distance_m: 1000}]
    express: {speed_kmh: 130, distance_m: 500}
    local: {speed_kmh: 130, distance_m: 500}
  terminal: [{speed_kmh: 160, distance_m: 4000}, {speed_kmh: 100, distance_m: 1000}]
