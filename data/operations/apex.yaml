# APEx alignment status. Drawn segments listed under `finished` are final alignments and
# are fitted to the drawing (20 m); every other segment is a sketch that a Hartwell-era
# engineer would still smooth, so its curves get the largest radius within
# `sketch_tolerance_m` of the drawing. Entries are segment-name regexes, or
# {match, bbox: [lat_min, lon_min, lat_max, lon_max]} for the finished part of a segment.
# Read by tools/make_apex_configs.py.
sketch_tolerance_m: 250

# Station classes: Limited = every train stops; Express = some trains stop; Local = only the
# all-stops trains stop. Every APEx station has platform screen doors (no platform-edge
# limit for passing trains, no slipstream / track-intrusion concern).
#
# APEx runs on its own right of way (no mixed traffic, so cant and deficiency are set for
# HSR alone). The few unavoidable shared approaches, with switches and other trains, are
# speed-restricted around the station: [assumed] 30 mph through the interlocking
# (AREMA #15-#20 turnouts, mixed-traffic signalling), `distance_m` each side.
shared_approaches:
  - {station: Cincinnati Union Terminal, speed_mph: 30, distance_m: 1500}

