# Commuter / RER rolling stock. SI unless suffixed. Sources in each entry's `sources`.
# [P] published, [S] secondary, [E] estimate (see docs/RESEARCH.md for derivations).

MBTA_HSP46_6BL:
  name: MBTA HSP46 + 6 bilevel coaches (push-pull)
  category: loco
  length_m: 177          # 21 m loco + 6 x 26.0 m coaches [S]
  cars: 6                # passenger cars (door count basis)
  mass_empty_t: 490      # 130.4 t loco [S] + 6 x ~60 t bilevels [E]
  pax: 1080              # 6 x ~180 capacity [S]
  kg_per_pax: 80
  rotating_mass_factor: 0.07   # coaches 1.06, loco 1.09 (Wende) weighted [S/E]
  adhesive_mass_fraction: 0.27 # loco only
  adhesion: 0.25         # implied by 289 kN on 130 t [E]
  max_te_kn: 289         # 65,000 lbf starting [S]
  power_kw: 2850         # ~3,200 kW at wheel minus ~300 kW HEP for 6 bilevels [S/E]
  max_accel: 0.6         # rarely binding: loco-hauled is effort/power limited
  service_brake: 0.6     # timetable braking for loco-hauled push-pull 0.5-0.7 [E]
  max_service_brake: 0.9 # ~2 mph/s full service [E]
  emergency_brake: 1.2
  brake_delay_s: 2.5     # pneumatic brake-pipe propagation / cylinder fill [E]
  jerk: 0.5
  max_speed_mph: 80      # MBTA service limit [S]
  davis: {A_n: 6000, B_n_per_ms: 80, C_n_per_ms2: 14}  # SC-44/HSP46 + 6 bilevels [E]
  doors_per_side: 2
  door_channels: 1       # traps/steps at low platforms; 1 stream per door
  door_open_s: 4.0
  door_close_s: 6.0
  floor: high
  sources: >-
    HSP46 mass/TE/HEP: Wikipedia MPI HSP46, Railway Age; bilevel fleet: Wikipedia MBTA bilevel
    cars; Davis: derived from modified Davis + Davis aero (research_commuter.md 2.2)

# ---------------------------------------------------------------------------------------
# Cincinnati RER (TRI) canon fleet. Designed by CMCC; each takes specs from its real
# inspiration (research_rer_fleet.md -> docs/RESEARCH.md). Formations are the assumed
# standard service consists; edit `cars`/`length_m`/masses for other formations.
# Davis coefficients scale the 4-car EMU reference (A 2,500 N, B 40, C 6.0 at 200 t / 105 m):
# A ~ 12.5 N/t, B ~ 0.2 N/(m/s) per t, C ~ 2.5 + 0.035 N/(m/s)^2 per m (x1.15 bilevel).
# ---------------------------------------------------------------------------------------

RER_BRIGHTLINER:
  name: TRI Brightliner (1934-51, Zephyr-type articulated stainless EMU, 1500 V DC)
  category: emu
  length_m: 82            # 4-section articulated set (Zephyr 3-section = 60.1 m [P])
  cars: 4
  mass_empty_t: 128       # Zephyr 94.4 t for 3 sections [P] scaled to 4 [E]
  pax: 260
  rotating_mass_factor: 0.08
  adhesive_mass_fraction: 0.4   # powered end trucks only [E]
  adhesion: 0.22                # 1930s control, no slip control [E]
  power_kw: 900                 # 1930s 1500 V DC traction for a 4-section set [E]
  max_accel: 0.6
  service_brake: 0.8
  max_service_brake: 1.0
  brake_delay_s: 1.5
  jerk: 0.6
  max_speed_mph: 90
  davis: {A_n: 1700, B_n_per_ms: 26, C_n_per_ms2: 4.5}   # streamlined front [E]
  doors_per_side: 1
  door_channels: 1
  door_open_s: 3.0
  door_close_s: 5.0
  floor: low              # retractable steps (canon)
  sources: Pioneer Zephyr mass/length (Wikipedia); electric traction values are canon estimates

