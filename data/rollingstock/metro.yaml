# Long-car variant: 60 ft (18.3 m) cars, 8-car trains, same cross-section.
# Curve ban: the network clearance envelope allows a 48 ft car (truck centres ~34 ft) on
# ~45 m curves; the same mid-car swing (L^2/8R) for 60 ft cars (truck centres ~41 ft)
# occurs at ~65 m, so long cars are barred from curves under 65 m (cf. R46 ban, ~61 m).
