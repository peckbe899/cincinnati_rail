# Metro rolling stock. SI unless suffixed. [P] published, [S] secondary, [E] estimate.
# Research notes: docs/RESEARCH.md (metro section).
#
# Davis defaults for steel-wheel metro (research): A ~19 N/t, B ~0.33 N/(m/s) per t,
# C ~10 N/(m/s)^2 open air for a 6-car ~120 m train (blunt ends, inter-car gaps);
# tunnel factor ~2.0 for single-track tubes.

MBTA_OL_CRRC_6CAR:
  name: MBTA Orange Line CRRC #14 (6 cars)
  category: metro
  length_m: 119           # 6 x 19.8 m (65 ft) [S]
  cars: 6
  mass_empty_t: 216       # ~36 t/car AW0 [E from reported 80,000 lb shell + equipment]
  mass_load_t: 48         # AW2 ~ +8 t/car [E]
  rotating_mass_factor: 0.09
  adhesive_mass_fraction: 1.0   # all axles motored [E]
  adhesion: 0.25
  power_kw: 2500          # knee >= 16.3 mph at 2.75 mphps up to AW2 => ~2.5 MW at wheel [P/E]
  max_accel: 1.23         # 2.75 mphps, VE-10-036 [P]
  service_brake: 1.1      # planning rate; full service 3.0 mphps [P]
  max_service_brake: 1.34 # 3.0 mphps [P]
  emergency_brake: 1.43   # 3.2 mphps [E, US practice]
  brake_delay_s: 0.5      # dynamic/EP brakes
  jerk: 0.9               # ~2 mphpsps [E]
  max_speed_mph: 63       # in-service max [P]
  davis: {A_n: 4470, B_n_per_ms: 71, C_n_per_ms2: 9.9}
  tunnel_factor: 2.0
  regen_efficiency: 0.6
  doors_per_side: 3       # [P partial]
  door_channels: 1        # Puong (MIT) MBTA dwell coefficients are per door
  door_open_s: 2.5
  door_close_s: 4.5
  floor: level
  sources: MBTA VE-10-036 Red/Orange technical spec (2013); WGBH; research_metro.md 1a

MBTA_BL_NO5_6CAR:
  name: MBTA Blue Line Siemens No. 5 (6 x 48 ft)
  category: metro
  length_m: 88            # 6 x 14.6 m [S]
  cars: 6
  mass_empty_t: 172       # ~28.5 t/car [E]
  mass_load_t: 36
  rotating_mass_factor: 0.09
  adhesive_mass_fraction: 1.0
  adhesion: 0.25
  power_kw: 2000          # [E] ~9.6 kW/t
  max_accel: 1.25         # 2.8 mphps [E]
  service_brake: 1.1
  max_service_brake: 1.34
  emergency_brake: 1.43
  brake_delay_s: 0.5
  jerk: 0.9
  max_speed_mph: 55       # [S]
  davis: {A_n: 3300, B_n_per_ms: 57, C_n_per_ms2: 8.0}
  tunnel_factor: 2.0
  regen_efficiency: 0.6
  doors_per_side: 2       # [S]
  door_channels: 1
  door_open_s: 2.5
  door_close_s: 4.5
  floor: level
  sources: metro-trains-database; Railway Gazette; research_metro.md 6a (mass/performance estimated)

# ---------------------------------------------------------------------------------------
# Cincinnati Metro canon fleet (CMCC). 48 ft (14.6 m) cars in 10-car trains (146 m).
# Hill gearing: GE-type motors sized for 50 per mille, all axles motored (Steinway Lo-V
# principle: higher reduction, more effort, lower top speed). German magnetic track
# brakes add ~0.7 m/s^2 in EMERGENCY only (not used in timetable running).
# Performance by era follows NYC practice: 1.5 mphps (1904), 2.0 (1920s), 2.5 (R-type
# 1940s-80s), 2.75-3.0 (AC traction).
# ---------------------------------------------------------------------------------------

CMCC_TYPE1903_10CAR:
  name: CMCC Type 1903 (10 x 48 ft, steel, hill-geared)
  category: metro
  length_m: 146
  cars: 10
  mass_empty_t: 340       # ~34 t/car (Steinway Lo-V 33.6 t; heavier steel framing) [S/E]
  mass_load_t: 75         # 10 x ~100 pax x 75 kg at a busy load [E]
  rotating_mass_factor: 0.12   # heavy DC motors, high gear reduction [E]
  adhesive_mass_fraction: 1.0
  adhesion: 0.20          # no slip control [E]
  power_kw: 3000          # 10 x 2 x 200 hp (GE 69 class) at wheel ~ 300 kW/car [S/E]
  natural_speed_kmh: 50   # series-wound DC: effort falls ~1/v^2 at speed [E]
  max_accel: 0.67         # 1.5 mphps [E, IRT 1904]
  service_brake: 0.9      # automatic air, 2 mphps [E]
  max_service_brake: 1.1
  emergency_brake: 1.8    # air + magnetic track brakes [E]
  brake_delay_s: 1.5
  jerk: 0.6
  max_speed_mph: 40       # hill gearing trades top speed for grade ability [E]
  davis: {A_n: 7500, B_n_per_ms: 115, C_n_per_ms2: 12.0}   # plain bearings, open platforms [E]
  tunnel_factor: 2.0
  doors_per_side: 2
  door_channels: 1
  door_open_s: 3.0        # manual/pneumatic doors [E]
  door_close_s: 6.0
  floor: level
  min_curve_radius_m: 30
  sources: canon; IRT Hi-V/Lo-V and Steinway Lo-V (research_metro.md 6b)

