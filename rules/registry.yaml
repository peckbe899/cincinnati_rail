rules:
  - id: geometry.method.per_stretch
    domain: geometry
    text: The tunnel method is chosen once for each stretch between two anchors and the profile is then checked against
      it; it is never chosen per sample from the depth.
    status: ratified
    ruling:
      date: 2026-11-04
      by: Ben
      words: rethink how the logic needs to work ... the kind of logic that a transit engineer would use when deciding
        how drives work
      source: data/profile/README.md:116; claude/Station_3D_Log.md 2026-11-04
    decision: null
    rank: null
    params: []
    applies_to:
    - metro
    flags: []
    tests: []
    history:
    - 2026-10-28 per-point classes C/E/B then drives
    - 2026-10-31 one pass by engineering rules
    - 2026-11-01 method by cost
    - 2026-11-04 one method per stretch, cost sums removed
    notes: 'The ranked list below is what the engine does; the Hub Region checklist (6 November) still lists ratifying
      it as an open ruling (lean: ratify as the engine has it).'
  - id: geometry.anchor.kinds
    domain: geometry
    text: 'A stretch ends only at an anchor: a box station, a portal (open track), the sunk river box, a canon box section
      (canal, covered way), a change of building phase, or a painted shaft. A mined station is inside its drive, not
      an anchor.'
    status: ratified
    ruling:
      date: '2026-11-06'
      by: Ben
      words: ratify all, as long as you're sure that these are correct
      source: 'this session, 6 November 2026, after a line-by-line check against profiles.html solveTypes (1384-1505);
        earlier: profiles.html:1344-1345,1452; data/profile/README.md:116'
    decision: null
    rank: null
    params: []
    applies_to:
    - metro
    flags: []
    tests: []
    history:
    - 2026-10-28 stretches between station boxes, portals, canon sections, rivers and phase changes
    - 2026-10-31 boxes are the only break points
    - 2026-11-04 shafts added, mined stations inside drives
    - '2026-11-06: ratified by Ben (the eleven tunnel-method rules, checked against the code)'
    notes: Ben chose the Shaft brush on 4 November (not quoted).
  - id: geometry.anchor.shaft_brush
    domain: geometry
    text: A painted shaft is a point where the method may change; a stretch is split there. Painting Auto over it clears
      it.
    status: provisional
    ruling:
      date: 2026-11-04
      by: Ben
      words: null
      source: data/profile/README.md:116; profiles.html:1415-1417
    decision: null
    rank: null
    params: []
    applies_to:
    - metro
    flags: []
    tests: []
    history:
    - 2026-11-04 added with the per-stretch engine
    notes: Ben's choice among options offered on 4 November; the realism audit's working shafts of 1 November (pockets
      at tube spacing) are gone.
  - id: geometry.method.paint_final
    domain: geometry
    text: A paint sets the method of every stretch it touches, snapped out to the anchors; it is never overridden, and
      what cannot be built under it is hatched and flagged.
    status: ratified
    ruling:
      date: '2026-11-06'
      by: Ben
      words: ratify all, as long as you're sure that these are correct
      source: 'this session, 6 November 2026, after a line-by-line check against profiles.html solveTypes (1384-1505);
        earlier: claude/Drive_Selection_Root_Causes_2026-11-04.md:3; profiles.html:1346-1348,1494-1495'
    decision: method_per_stretch
    rank: 1
    params:
    - literal.MIN_RUN
    applies_to:
    - metro
    flags:
    - Painted (snapped, note)
    - Painted (two paints in one stretch, warning)
    tests: []
    history:
    - 2026-10-31 a tube paint over a box the rules need was a warning, the paint winning on the drawing
    - 2026-11-04 paints snapped to anchors; the larger of two paints wins with a warning
    - '2026-11-06: ratified by Ben (the eleven tunnel-method rules, checked against the code)'
    notes: Ben's words are a complaint, not the rule; the Hub Region checklist lists ratifying the ranked list as open.
      The RER still reads paints per point (typeAt).
  - id: geometry.method.bank_works
    domain: geometry
    text: 'A stretch touching the sunk river box with no mined station and shorter than the phase''s shortest drive
      is the bank works: cut and cover in a cofferdam, the immersed tunnel''s land end.'
    status: ratified
    ruling:
      date: '2026-11-06'
      by: Ben
      words: ratify all, as long as you're sure that these are correct
      source: 'this session, 6 November 2026, after a line-by-line check against profiles.html solveTypes (1384-1505);
        earlier: claude/Station_3D_Log.md 2026-10-31 (one pass, 5); profiles.html:1496'
    decision: method_per_stretch
    rank: 2
    params:
    - metro_structure.phases.1.min_drive
    - metro_structure.phases.2.min_drive
    - metro_structure.phases.3.min_drive
    applies_to:
    - metro
    - tri
    flags:
    - Tunnel method (note)
    tests: []
    history:
    - 2026-10-31 leftover beside the sunk box is the bank works
    - 2026-11-04 kept as rank 2
    - '2026-11-06: ratified by Ben (the eleven tunnel-method rules, checked against the code)'
    notes: Mined stations beside a river excepted. Never flagged as unbuildable even past cc_max (p.bank).
  - id: geometry.method.canon_bored
    domain: geometry
    text: A stretch the canon marks bored (a shallow or deep founding section, or under a river) is a bored drive.
    status: ratified
    ruling:
      date: '2026-11-06'
      by: Ben
      words: ratify all, as long as you're sure that these are correct
      source: 'this session, 6 November 2026, after a line-by-line check against profiles.html solveTypes (1384-1505);
        earlier: profiles.html:1385,1497; CANON table profiles.html:293-323'
    decision: method_per_stretch
    rank: 3
    params: []
    applies_to:
    - metro
    flags: []
    tests: []
    history:
    - 2026-10-09 canon sections decide the type
    - 2026-11-02 a canon method section is only a hint for paints (a paint inside one is checked)
    - 2026-11-04 canon bored forces the drive
    - '2026-11-06: ratified by Ben (the eleven tunnel-method rules, checked against the code)'
    notes: 'Conflict in wording: the paint-fit rule calls a canon method section ''only a hint'', the engine makes it
      force a drive when unpainted.'
  - id: geometry.method.mined_station_forces_drive
    domain: geometry
    text: A stretch with a mined station in it is one bored drive through the station. A station selected as a box,
      or within the phase's cut-and-cover limit, is an anchor and not part of any stretch, so there is no exception.
    status: ratified
    ruling:
      date: '2026-11-06'
      by: Ben
      words: ratify all, as long as you're sure that these are correct
      source: 'this session, 6 November 2026, after a line-by-line check against profiles.html solveTypes (1384-1505);
        earlier: profiles.html:1498,1501; claude/Station_3D_Log.md 2026-10-31 (one pass, 3)'
    decision: method_per_stretch
    rank: 4
    params: []
    applies_to:
    - metro
    flags: []
    tests: []
    history:
    - 2026-10-29 a drive is deep if it reaches a deep station
    - 2026-10-31 one drive through any mined stations
    - 2026-11-04 rank 4; a mined station in a box stretch is flagged, not overridden
    - '2026-11-06: text corrected to the code (solveTypes 1489, 1498): no ''unless cut and cover is feasible'' clause
      exists'
    - '2026-11-06: ratified by Ben (the eleven tunnel-method rules, checked against the code)'
    notes: ''
  - id: geometry.method.both_feasible_phase_prefers
    domain: geometry
    text: 'Where cut and cover end to end and a bored drive are both feasible, the phase''s preference decides: Phase
      1 cut and cover, later phases bored.'
    status: ratified
    ruling:
      date: '2026-11-06'
      by: Ben
      words: ratify all, as long as you're sure that these are correct
      source: 'this session, 6 November 2026, after a line-by-line check against profiles.html solveTypes (1384-1505);
        earlier: data/profile/README.md:116; data/profile/metro_structure.json:247 (prefer_about); profiles.html:1499'
    decision: method_per_stretch
    rank: 5
    params:
    - metro_structure.phases.1.prefer
    - metro_structure.phases.2.prefer
    applies_to:
    - metro
    flags:
    - Tunnel method (note)
    tests: []
    history:
    - '2026-10-28 between the limits: cut and cover unless the bored stretch makes a whole drive (handoff)'
    - 2026-11-01 the cheaper by cost
    - 2026-11-04 the phase's prefer
    - '2026-11-06: ratified by Ben (the eleven tunnel-method rules, checked against the code)'
    notes: Ben's choice on 4 November (phase preference), not quoted.
  - id: geometry.method.one_feasible
    domain: geometry
    text: Where only one method is feasible that one is taken, and the stretch note says why the other was not.
    status: ratified
    ruling:
      date: '2026-11-06'
      by: Ben
      words: ratify all, as long as you're sure that these are correct
      source: 'this session, 6 November 2026, after a line-by-line check against profiles.html solveTypes (1384-1505);
        earlier: profiles.html:1500-1501'
    decision: method_per_stretch
    rank: 6
    params: []
    applies_to:
    - metro
    flags:
    - Tunnel method (note)
    tests: []
    history:
    - '2026-11-04'
    - '2026-11-06: ratified by Ben (the eleven tunnel-method rules, checked against the code)'
    notes: ''
  - id: geometry.method.neither_feasible_nearer
    domain: geometry
    text: 'Where neither method is feasible the stretch is drawn as the nearer to feasible (fewer bad samples; a tie
      by the phase''s preference; a mined station forces bored) and flagged as an error: lower the rail for a drive,
      raise it for a box, or paint a shaft.'
    status: ratified
    ruling:
      date: '2026-11-06'
      by: Ben
      words: ratify all, as long as you're sure that these are correct
      source: 'this session, 6 November 2026, after a line-by-line check against profiles.html solveTypes (1384-1505);
        earlier: profiles.html:1502-1507'
    decision: method_per_stretch
    rank: 7
    params: []
    applies_to:
    - metro
    flags:
    - Tunnel method (error)
    tests: []
    history:
    - '2026-11-04'
    - '2026-11-06: ratified by Ben (the eleven tunnel-method rules, checked against the code)'
    notes: ''
  - id: geometry.feasibility.box
    domain: geometry
    text: Cut and cover is feasible for a stretch only where every tunnel sample is within the phase's cut-and-cover
      limit, there is no mined station and the canon does not say bored.
    status: ratified
    ruling:
      date: '2026-11-06'
      by: Ben
      words: ratify all, as long as you're sure that these are correct
      source: 'this session, 6 November 2026, after a line-by-line check against profiles.html solveTypes (1384-1505);
        earlier: profiles.html:1366,1489'
    decision: null
    rank: null
    params:
    - metro_structure.phases.1.cc_max
    - metro_structure.phases.2.cc_max
    - metro_structure.phases.3.cc_max
    applies_to:
    - metro
    flags: []
    tests: []
    history:
    - 2026-10-28 cc_max per phase
    - '2026-11-06: ratified by Ben (the eleven tunnel-method rules, checked against the code)'
    notes: ''
  - id: geometry.feasibility.drive
    domain: geometry
    text: A drive is feasible where the launch boxes from each anchor carry on until the tube has its full cover, held
      over the approach length, and stay within the cut-and-cover limit; the drive between them is at least the phase's
      shortest drive, or runs through a mined station whatever its length; and nothing in it has less than the hard
      fraction of a diameter of cover.
    status: ratified
    ruling:
      date: '2026-11-06'
      by: Ben
      words: ratify all, as long as you're sure that these are correct
      source: 'this session, 6 November 2026, after a line-by-line check against profiles.html solveTypes (1384-1505);
        earlier: profiles.html:1479-1490'
    decision: null
    rank: null
    params:
    - metro_structure.approach_m
    - literal.approach_K_window
    - metro_structure.cost.cover_hard
    - metro_structure.phases.1.min_drive
    - metro_structure.phases.2.min_drive
    - metro_structure.phases.3.min_drive
    - metro_structure.tubes.A.outside
    - metro_structure.tubes.C.outside
    - metro_structure.tubes.bore.outside
    applies_to:
    - metro
    flags: []
    tests: []
    history:
    - 2026-10-28 min_drive applies only to pockets; box to box is a drive at any length (Ben's answer)
    - 2026-10-29 the only drive between two anchors is bored at any length
    - 2026-11-04 the drive must be at least min_drive unless mined
    - '2026-11-06: ''or through a mined station whatever its length'' added to match solveTypes 1490'
    - '2026-11-06: ratified by Ben (the eleven tunnel-method rules, checked against the code)'
    notes: 'Conflict: Ben''s 28 October answer and the 29 October rule make a box-to-box tunnel a drive at any length;
      the 4 November engine requires min_drive for the drive between the launch boxes. Entered once, unratified.'
  - id: geometry.launch_box.full_cover
    domain: geometry
    text: The launch box from a station, portal or box carries on until the tube has one full diameter of cover, and
      the drive the rules make starts only there.
    status: ratified
    ruling:
      date: 2026-10-29
      by: Ben
      words: the boxes carry on until the tube has its cover
      source: claude/Station_3D_Log.md 2026-11-03 (depth check); data/profile/README.md:114
    decision: null
    rank: null
    params:
    - metro_structure.tubes.A.outside
    - metro_structure.tubes.C.outside
    - metro_structure.tubes.bore.outside
    - literal.approach_K_window
    applies_to:
    - metro
    flags: []
    tests: []
    history:
    - 2026-10-29 rule stated
    - 2026-11-01 the cost logic let drives start short of cover with treatment (broke the rule)
    - '2026-11-03 restored: the box carries through every sample short of a full diameter (Ben: ''The depth check needs
      to be fixed. it needs to work.'')'
    - 2026-11-04 the box ends where cover is held over approach_m, not at a blip
    notes: ''
  - id: geometry.shortfall.flag_not_change
    domain: geometry
    text: 'Inside a stretch a shortfall is a flag, never a change of method: a tube short of a full diameter is bored
      with ground treatment (a warning), short of half a diameter unbuildable; a box past its limit unbuildable.'
    status: ratified
    ruling:
      date: '2026-11-06'
      by: Ben
      words: ratify all, as long as you're sure that these are correct
      source: 'this session, 6 November 2026, after a line-by-line check against profiles.html solveTypes (1384-1505);
        earlier: claude/Station_3D_Log.md 2026-10-31 (low cover); profiles.html:1354-1355,1530-1535,1556-1573'
    decision: null
    rank: null
    params:
    - metro_structure.cost.cover_hard
    - literal.low_cover_min_short
    - literal.station_limit_tol
    applies_to:
    - metro
    flags:
    - Low cover (warning)
    - unbuildable cover (error, hatched)
    - unbuildable box (error, hatched)
    tests: []
    history:
