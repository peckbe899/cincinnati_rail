# CVG Express: Union Terminal (track level) - CVG Terminals 3, 2, 4, 1B, 1A (Ben, Oct 16).
# Profile: Ben's design on the Rail Profiles page (data/profile/alignments/CVG_Express.json).
name: CVG Express (Union Terminal - CVG Terminal 1A)
kmz: data/kmz/CVG_Express.kmz
operations: data/operations/cvg_express.yaml
track:
  folder: CVG Express New
  exclude: [CVG Express 5 - Original, CVG Express Yard, Maintenance Building]
stations:
  folder: CVG Express New
  defaults:
    class: busy
    psd: true
    platform_length_m: 204.216   # exactly 670 ft
  info:
    Terminal 1A:
      class: terminal
service:
  route:
  # no Union Terminal placemark in the KMZ: the centre of its platform, 102 m from the drawn start
  - {name: Union Terminal, lat: 39.1090931, lon: -84.5384779}
  - Terminal 3
  - Terminal 2
  - Terminal 4
  - Terminal 1B
  - Terminal 1A
  headway_min: 5      # 12 trains an hour
turnback_min: 5       # 5 min at Union Terminal (2 platforms); the same is assumed at Terminal 1A
geometry:
  line_speed_mph: 124
  max_cant_in: 6.0                 # 150 mm
  design_cant_deficiency_in: 4.0   # 100 mm
  min_spiral_m: 60.0
  group_dev_tol_m: 12.0
  corner_offset_tol_m: 50.0
speed:
  cant_deficiency_in: 4.0
  increment_mph: 5
  min_zone_m: 300.0
profile:
  max_grade: 0.05
  analyzer:
    line: data/profile/lines/CVG_Express.json
    alignment: data/profile/alignments/CVG_Express.json
    settings: data/profile/settings.json
years: [2026, 2100]
