# A station complex: the stations of several lines that are one station (read only until checklist 2.1.4).
kind: station_complex
version: 1
title: Station complex
description: >-
  The stations of several lines that are one station, as the old hub's params/station_complexes holds them: the 3D
  build's same-name groups (auto) and Ben's marks (marked). The access rules read it (an interchange at opening); the
  old_hub importer writes it, one record per group, and nothing else does until real complexes (2.1.4).
geometry: none
columns:
  name: /name
merge:
  unit: field
  rebase: auto
legacy: [station_complex]
seeded: false
schema:
  type: object
  additionalProperties: false
  required: [key, name, group, members]
  properties:
    key:
      description: The group's id in params/station_complexes (gray:-839:8229, marked:terminal2).
      type: string
      minLength: 1
    name:
      type: string
    group:
      description: auto (the 3D build's same-name groups) or marked (Ben's).
      enum: [auto, marked]
    x:
      type: [number, "null"]
      x-unit: m
    y:
      type: [number, "null"]
      x-unit: m
    members:
      type: array
      items:
        type: object
        additionalProperties: true
        required: [line, station]
        properties:
          sys: {type: string}
          line: {type: string}
          station: {type: string}
          c: {type: [number, "null"], x-unit: m}
          x: {type: [number, "null"], x-unit: m}
          y: {type: [number, "null"], x-unit: m}
    attrs:
      description: Any other member of the group, kept as the old hub wrote it.
      type: object
  examples:
    - key: gray:-839:8229
      name: Gray
      group: auto
      x: -839.4
      y: 8229.2
      members: [{sys: metro, line: Line_1, station: Gray, c: 4596.4, x: -840.12, y: 8231.77}]
