[project]
name = "railsim"
version = "10.0.0"
description = "Physics-based metro and commuter/RER running-time simulators for hand-drawn KMZ alignments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "pyyaml>=6"]

[project.optional-dependencies]
# the local hub (hub/hub.py) and the tools it runs: Deck tie, Profiles context, Station 3D sync
hub = ["shapely>=2", "pyproj>=3.5", "rasterio>=1.3"]

[project.scripts]
railsim-metro = "railsim.metro:main"
railsim-commuter = "railsim.commuter:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["railsim"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
